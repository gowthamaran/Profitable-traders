[project]
name = "sri-wagmi"
version = "1.0.0"
description = "A Solana meme coin scanner that reports what it can confirm and says so when it cannot."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "python-telegram-bot[job-queue]==21.9",
    "aiohttp==3.11.11",
]

[project.scripts]
sri-wagmi = "sri_wagmi.bot.app:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sri_wagmi*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
